function list(){const q=($('#q')?.value||'').toLowerCase(),its=S.secs[ui.sec].it;
 prog();
 const r=its.map((it,i)=>({it,i})).filter(({it})=>(it.c+' '+it.d).toLowerCase().includes(q)&&(ui.f=='t'||(ui.f=='p'?!ok(it):df(it)!==null&&df(it)!==0)));
 const k={c:x=>x.it.c,n:x=>x.it.d,v:x=>x.it.fv||'9999'}[ui.o];
 if(k)r.sort((a,b)=>String(k(a)).localeCompare(String(k(b)),'es',{numeric:true}));
 $('#main').innerHTML=r.map(({it,i})=>card(it,i)).join('')+'<button class="pri" style="width:100%;padding:14px" onclick="add()">Agregar producto</button>'}
function upd(i){const it=cur(i),v=df(it),d=$('#d'+i);d.textContent=dtxt(v);d.className='diff '+dcls(v);$('#t'+i).innerHTML=tag(it);prog();save()}
function setV(i,k,v){cur(i).w[ui.wk][k]=v===''?null:Number(v);upd(i)}
function setFv(i,v){cur(i).fv=v;upd(i)}
function setSt(i,b){cur(i).st=b?1:0;upd(i)}
let tm=0;
function add(){$('#ac').value='';$('#ad').value='';$('#as').textContent=CFG.proxy?'Escribe el código y busco la descripción en la página de la farmacia.':'Escribe el código y la descripción. Para la búsqueda automática, conéctala en Más.';$('#sh').hidden=false;setTimeout(()=>$('#ac').focus&&$('#ac').focus(),50)}
function shut(){$('#sh').hidden=true}
function acIn(){clearTimeout(tm);const c=$('#ac').value.trim();if(c.length<3||!CFG.proxy)return;tm=setTimeout(()=>find(c),600)}
async function find(c){const s=$('#as');s.textContent='Buscando en la página…';const j=await look(c);if($('#ac').value.trim()!==c)return;
 if(j.found){$('#ad').value=String(j.name).toUpperCase();s.textContent='✓ Encontrado en la página. Puedes corregirlo.'}
 else s.textContent=j.err?'No pude conectar con la página. Escribe la descripción a mano.':'No encontré ese código en la página. Escribe la descripción a mano.'}
async function saveNew(){const c=$('#ac').value.trim(),d=$('#ad').value.trim(),its=S.secs[ui.sec].it;if(!c||!d)return uiAlert('Escribe el código y la descripción.');
 if(its.some(i=>i.c===c)&&!await uiConfirm('Ese código ya está en esta sección. ¿Agregarlo igual?'))return;
 its.push({c,d:d.toUpperCase(),fv:'',st:0,w:[0,1,2,3].map(()=>[null,null])});save();shut();ui.f='t';ui.o='o';ctl();list();scrollTo(0,document.body.scrollHeight)}
async function edit(i){const it=cur(i),c=await uiPrompt('Código',it.c);if(c===null)return;const d=await uiPrompt('Descripción',it.d);if(d===null)return;it.c=c.trim()||it.c;it.d=d.trim()||it.d;save();list()}
async function del(i){if(await uiConfirm('¿Eliminar este producto?')){S.secs[ui.sec].it.splice(i,1);save();list()}}


function res(){$('#flt').innerHTML='';
 $('#ctl').innerHTML=`<div class="bar"><select onchange="ui.wk=+this.value;res()">${opt([0,1,2,3].map(i=>[i,'Semana '+(i+1)]),ui.wk)}</select></div>`;
 let h='',T=[0,0,0,0];const det=[];
 const box=(t,n,tot,fa,so)=>`<div class="card"><div class="desc">${t}</div><div class="top"><span>Contados ${n} de ${tot}</span><span><b class="neg">${fa}</b> faltan · <b class="pos">+${so}</b> sobran</span></div></div>`;
 S.secs.forEach(s=>{let n=0,fa=0,so=0;s.it.forEach(it=>{const[a,b]=it.w[ui.wk];if(a!==null&&b!==null){n++;const d=b-a;if(d<0)fa+=d;if(d>0)so+=d;if(d)det.push({s,it,d})}});
  T[0]+=n;T[1]+=s.it.length;T[2]+=fa;T[3]+=so;h+=box(esc(nm(s)),n,s.it.length,fa,so)});
 $('#main').innerHTML=box('Total',T[0],T[1],T[2],T[3])+h+(det.length?'<h2 style="font-size:16px">Productos con diferencia</h2>'+det.map(({s,it,d})=>`<div class="card"><div class="top"><span>${esc(it.c)} · ${esc(nm(s))}</span><b class="${dcls(d)}" style="font-size:20px">${dtxt(d)}</b></div><div class="desc" style="margin:2px 0 0">${esc(it.d)}</div></div>`).join(''):'')+'<button class="pri" style="width:100%;padding:14px" onclick="exportXlsx()">Exportar Excel</button><button style="width:100%;padding:14px;margin-top:8px" onclick="exportPdf()">Exportar PDF</button>'}
function mas(){$('#flt').innerHTML='';$('#ctl').innerHTML='';
 const c=(t,p,b)=>`<div class="card"><div class="desc">${t}</div><p class="top">${p}</p>${b}</div>`;
 $('#main').innerHTML=c('Importar inventario','Carga tu inventario desde un Excel, ODS o CSV con las columnas CODIGO, DESCRIPCION y F.V. Reemplaza el inventario actual.','<button class="pri" onclick="$(\'#imf\').click()">Importar desde Excel</button>')
 +c('Conexión con la página de la farmacia',CFG.proxy?'Conectada: al agregar un producto, la descripción se completa sola con el código (SKU).':'Aún no está conectada. Crea tu buscador gratis con la guía y pega su dirección aquí.','<button class="pri" onclick="cfgProxy()">'+(CFG.proxy?'Cambiar dirección':'Configurar')+'</button> '+(CFG.proxy?'<button onclick="testProxy()">Probar conexión</button>':''))
 +c('Exportar','Excel con tu formato exacto (horizontal, columnas y encabezado azul) o PDF listo para imprimir.','<button class="pri" onclick="exportXlsx()">Exportar Excel</button> <button class="pri" onclick="exportPdf()">Exportar PDF</button>')
 +c('Copia de seguridad','Guarda tu inventario en un archivo para no perderlo si borras los datos del navegador.','<button class="pri" onclick="backup()">Guardar copia</button> <button onclick="$(\'#rf\').click()">Restaurar copia</button><input id="rf" type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])">')
 +c('Secciones','Agrega una sección nueva o elimina la que estás viendo.','<button onclick="newSec()">Nueva sección</button> '+(S.secs.length?'<button onclick="delSec()">Eliminar sección actual</button>':''))
 +c('Nueva semana','Vacía sistema y físico de una semana. No borra productos ni fechas.','<button onclick="clearWeek()">Limpiar semana</button>')
 +c('Usuario: '+esc(CU.n),'Cierra tu sesión para que otra persona use su inventario.','<button class="pri" onclick="logout()">Cambiar de usuario</button> <button onclick="go(\'per\')">Mi perfil</button>'+(CU.adm?' <button onclick="adminPin()">Restablecer PIN de un usuario</button>':''))}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo-inventario-'+now.toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.secs||!d.secs.every(s=>Array.isArray(s.it)&&s.it.every(i=>i.c!==undefined&&Array.isArray(i.w)&&i.w.length===4)))throw 0;if(!await uiConfirm('Esto reemplaza el inventario actual. ¿Continuar?'))return;S=d;ui.sec=0;save();uiAlert('Copia restaurada');go('inv')}catch(e){uiAlert('El archivo no es una copia válida')}};r.readAsText(f)}
async function clearWeek(){const n=parseInt(await uiPrompt('¿Qué semana quieres limpiar? (1 a 4)'),10);if(!(n>=1&&n<=4))return;if(!await uiConfirm('Se borrarán sistema y físico de la semana '+n+' en todas las secciones. ¿Continuar?'))return;S.secs.forEach(s=>s.it.forEach(it=>it.w[n-1]=[null,null]));save();uiAlert('Semana '+n+' limpiada')}

U=ld('inv_users_v2',[]);
const sv=()=>localStorage.setItem('inv_users_v2',JSON.stringify(U));
const hs=async(i,s)=>{s=i+'|'+String(s).trim().toLowerCase();try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('saas|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p'+s}};
const A=h=>{const a=$('#auth');a.innerHTML=h;a.hidden=false;$('#app').hidden=true;if(a.classList){a.classList.remove('fi');void a.offsetWidth;a.classList.add('fi')}};
const gr=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'};
const lg=`<img src="${LOGO}" alt="Farmacia SAAS">`;
const pw=(id,ph)=>`<input id="${id}" type="password" inputmode="numeric" maxlength="6" placeholder="${ph}">`;
function welcome(){A(lg+`<h2>${gr()}</h2><p>${U.length?'Elige tu usuario para continuar':'Bienvenido(a). Crea tu usuario para empezar'}</p>`+U.map(u=>`<button class="ub" onclick="pin('${u.id}')"><span class="av">${u.pf&&u.pf.f?`<img src="${u.pf.f}" alt="">`:esc(u.n[0].toUpperCase())}</span>${esc(u.n)}</button>`).join('')+'<button class="pri" onclick="signup()">Crear usuario</button>')}
function signup(){A(lg+`<h2>Nuevo usuario</h2><p>${U.length?'Empezarás con un inventario vacío que puedes importar desde Excel.':'Tu inventario actual se guardará en este usuario.'}</p><input id="un" placeholder="Tu nombre">${pw('p1','PIN (4 a 6 números)')}<input id="qq" placeholder="Pregunta secreta (ej. ¿Nombre de tu mascota?)"><input id="aa" placeholder="Respuesta"><button class="pri" onclick="mk()">Crear usuario</button><button onclick="welcome()">Volver</button>`)}
async function mk(){const n=$('#un').value.trim(),p=$('#p1').value.trim(),q=$('#qq').value.trim(),a=$('#aa').value;
 if(!n||!q||!a.trim())return uiAlert('Completa nombre, pregunta y respuesta.');
 if(!/^\d{4,6}$/.test(p))return uiAlert('El PIN debe tener de 4 a 6 números.');
 if(U.some(u=>u.n.toLowerCase()===n.toLowerCase()))return uiAlert('Ese nombre ya existe.');
 const id='u'+Date.now(),first=!U.length;
 U.push({id,n,p:await hs(id,p),q,a:await hs(id,a),adm:first?1:0});sv();
 localStorage.setItem('inv_data_'+id,JSON.stringify(first?(ld(KEY,null)||DATA):{secs:[]}));enter(id)}
function pin(id){const u=U.find(x=>x.id==id);A(lg+`<h2>${esc(u.n)}</h2><p>Escribe tu PIN</p>${pw('p1','PIN')}<button class="pri" onclick="login('${id}')">Entrar</button><button onclick="forgot('${id}')">Olvidé mi PIN</button><button onclick="welcome()">Volver</button>`)}
async function login(id){const u=U.find(x=>x.id==id);if(await hs(id,$('#p1').value)===u.p)enter(id);else uiAlert('PIN incorrecto')}
function forgot(id){const u=U.find(x=>x.id==id);A(lg+`<h2>Recuperar PIN</h2><p>${esc(u.q)}</p><input id="aa" placeholder="Tu respuesta">${pw('p1','Nuevo PIN')}<button class="pri" onclick="reset('${id}')">Cambiar PIN</button><button onclick="pin('${id}')">Volver</button>`)}
async function reset(id){const u=U.find(x=>x.id==id),p=$('#p1').value.trim();if(await hs(id,$('#aa').value)!==u.a)return uiAlert('La respuesta no coincide.');if(!/^\d{4,6}$/.test(p))return uiAlert('El PIN debe tener de 4 a 6 números.');u.p=await hs(id,p);sv();uiAlert('PIN cambiado');pin(id)}
function enter(id){CU=U.find(x=>x.id==id);S=ld('inv_data_'+id,{secs:[]});if(!S.secs)S={secs:[]};ui.sec=0;ui.wk=0;ui.view='inv';$('#auth').hidden=true;$('#app').hidden=false;hdr();render();fade()}
function logout(){CU=null;S={secs:[]};welcome()}
async function adminPin(){const n=await uiPrompt('Usuario a restablecer:\n'+U.map(u=>u.n).join(', '));const u=U.find(x=>x.n.toLowerCase()===(n||'').trim().toLowerCase());if(!u)return;const p=(await uiPrompt('Nuevo PIN (4 a 6 números)')||'').trim();if(!/^\d{4,6}$/.test(p))return uiAlert('PIN no válido.');u.p=await hs(u.id,p);sv();uiAlert('PIN restablecido para '+u.n)}
function empty(){$('#ctl').innerHTML='';$('#flt').innerHTML='';$('#main').innerHTML='<div class="card"><div class="desc">Aún no tienes productos</div><p class="top">Importa tu inventario desde un Excel o crea una sección y agrega productos a mano.</p><button class="pri" onclick="$(\'#imf\').click()">Importar desde Excel</button> <button onclick="newSec()">Nueva sección</button></div>'}
async function newSec(){const n=(await uiPrompt('Nombre de la sección')||'').replace(/[:\\\/?*\[\]]/g,'').trim();if(!n)return;S.secs.push({n:n.replace(/ /g,'_').toUpperCase().slice(0,31),t:n.toUpperCase(),it:[]});ui.sec=S.secs.length-1;save();go('inv')}
async function delSec(){if(!S.secs.length||!await uiConfirm('¿Eliminar la sección "'+nm(S.secs[ui.sec])+'" con todos sus productos?'))return;S.secs.splice(ui.sec,1);ui.sec=0;save();render()}
function pfv(v){if(v==null||v==='')return['',0];
 if(v instanceof Date){const d=new Date(v.getTime()+432e5);let y=d.getFullYear();if(y<2000)y+=100;return[y+'-'+String(d.getMonth()+1).padStart(2,'0'),0]}
 const s=String(v),st=/\*/.test(s)?1:0,i=s.match(/^\s*(\d{4})-(\d{2})/);if(i)return[i[1]+'-'+i[2],st];
 const m=s.match(/(\d{1,2})\s*[\/\-]\s*(\d{2,4})/);if(!m)return['',st];let y=+m[2];if(y<100)y+=2000;return[y+'-'+m[1].padStart(2,'0'),st]}
async function imp(f){if(!f)return;if(!window.XLSX)return uiAlert('Para importar necesitas conexión a internet la primera vez.');
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),secs=[];
  const z=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
   const hr=rows.findIndex((r,i)=>i<15&&r.some(c=>z(c)==='CODIGO'));if(hr<0)return;
   const H=rows[hr].map(z),ci=H.indexOf('CODIGO'),di=H.findIndex(x=>x.startsWith('DESCRIP')),fi=H.findIndex(x=>x=='F.V'||x=='FV'||x.startsWith('VENC')||x.startsWith('F.VENC'));
   if(di<0)return;
   const t=rows.slice(0,hr).flat().find(c=>typeof c=='string'&&c.trim())||sn,it=[];
   rows.slice(hr+1).forEach(r=>{if(r[ci]==null||r[di]==null||!String(r[di]).trim())return;const[fv,st]=pfv(fi<0?null:r[fi]);it.push({c:String(r[ci]).trim(),d:String(r[di]).trim(),fv,st,w:[0,1,2,3].map(()=>[null,null])})});
   if(it.length)secs.push({n:sn.replace(/[:\\\/?*\[\]]/g,'').replace(/ /g,'_').toUpperCase().slice(0,31),t:String(t).trim(),it})});
  if(!secs.length)return uiAlert('No encontré una tabla con las columnas CODIGO y DESCRIPCION.');
  const n=secs.reduce((a,s)=>a+s.it.length,0);
  if(!await uiConfirm(`Encontré ${n} productos en ${secs.length} sección(es). ${S.secs.length?'Esto reemplaza tu inventario actual. ':''}¿Importar?`))return;
  S={secs};ui.sec=0;save();go('inv')}catch(e){uiAlert('No pude leer ese archivo.')}}
