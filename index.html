 50ML","fv":"","st":0,"w":[[null,null],[null,null],[null,null],[null,null]]}]}]};
const KEY='inv_farmacia_v1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=DATA;
const ui={sec:0,wk:0,view:'inv',mode:'mes',f:'t',o:'o'};
let warned=0;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!warned++)alert('No se pudo guardar en este navegador. Usa Más > Guardar copia para no perder tus datos.')}};
try{navigator.storage?.persist?.()}catch(e){}
const opt=(a,v)=>a.map(([k,x])=>`<option value="${k}" ${k==v?'selected':''}>${x}</option>`).join('');
const ok=it=>it.w[ui.wk][0]!==null&&it.w[ui.wk][1]!==null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date(),NM=now.getFullYear()*12+now.getMonth();
const md=it=>{if(!it.fv)return null;const[y,m]=it.fv.split('-').map(Number);return y*12+m-1-NM};
const lbl=it=>it.fv?it.fv.split('-').reverse().join('/'):'';
const nm=s=>s.n.replace(/_/g,' ');
function tag(it){const d=md(it);let t='';
 if(d!==null){if(d<0)t='<span class="tag n">Vencido</span>';else if(d==0)t='<span class="tag n">Vence este mes</span>';else if(d<=7)t=`<span class="tag w">Vence en ${d} ${d>1?'meses':'mes'}</span>`}
 return(it.st?'<span class="tag w">* </span>':'')+t}
const df=it=>{const[s,f]=it.w[ui.wk];return s===null||f===null?null:f-s};
const dtxt=v=>v===null?'–':v>0?'+'+v:''+v;
const dcls=v=>v===null?'':v<0?'neg':v>0?'pos':'';
const cur=i=>S.secs[ui.sec].it[i];

function ctl(){$('#ctl').innerHTML=`<div class="bar"><select onchange="ui.sec=+this.value;list()">${S.secs.map((s,i)=>[i,esc(nm(s))]).map(([k,x])=>`<option value="${k}" ${k==ui.sec?'selected':''}>${x}</option>`).join('')}</select><select onchange="ui.wk=+this.value;list()">${opt([0,1,2,3].map(i=>[i,'Semana '+(i+1)]),ui.wk)}</select></div>`;
 $('#flt').innerHTML=`<div id="prg" class="top" style="margin-bottom:8px"></div><input id="q" type="search" placeholder="Buscar por código o nombre" oninput="list()"><div class="bar" style="margin:8px 0"><select onchange="ui.f=this.value;list()">${opt([['t','Todos'],['p','Pendientes'],['d','Con diferencia']],ui.f)}</select><select onchange="ui.o=this.value;list()">${opt([['o','Orden original'],['c','Por código'],['n','Por nombre'],['v','Por vencimiento']],ui.o)}</select></div>`}
const card=(it,i)=>{const[s,f]=it.w[ui.wk],v=df(it);return `<div class="card"><div class="top"><span>${esc(it.c)}</span><span id="t${i}">${tag(it)}</span></div><div class="desc">${esc(it.d)}</div>
<label class="lb">Vence<input type="month" value="${it.fv}" onchange="setFv(${i},this.value)"></label>
<div class="row"><label>Sistema<input type="number" inputmode="numeric" value="${s??''}" onchange="setV(${i},0,this.value)"></label><label>Físico<input type="number" inputmode="numeric" value="${f??''}" onchange="setV(${i},1,this.value)"></label><div id="d${i}" class="diff ${dcls(v)}">${dtxt(v)}</div></div>
<div class="act"><button onclick="edit(${i})">Editar</button><button onclick="del(${i})">Eliminar</button><label><input type="checkbox" ${it.st?'checked':''} onchange="setSt(${i},this.checked)"> Próximo a vencer (*)</label></div></div>`};
function prog(){const its=S.secs[ui.sec].it;$('#prg').textContent=`Contados ${its.filter(ok).length} de ${its.length}`}
function list(){const q=($('#q')?.value||'').toLowerCase(),its=S.secs[ui.sec].it;
 prog();
 const r=its.map((it,i)=>({it,i})).filter(({it})=>(it.c+' '+it.d).toLowerCase().includes(q)&&(ui.f=='t'||(ui.f=='p'?!ok(it):df(it)!==null&&df(it)!==0)));
 const k={c:x=>x.it.c,n:x=>x.it.d,v:x=>x.it.fv||'9999'}[ui.o];
 if(k)r.sort((a,b)=>String(k(a)).localeCompare(String(k(b)),'es',{numeric:true}));
 $('#main').innerHTML=r.map(({it,i})=>card(it,i)).join('')+'<button class="pri" style="width:100%;padding:14px" onclick="add()">Agregar producto</button>'}
function upd(i){const it=cur(i),v=df(it),d=$('#d'+i);d.textContent=dtxt(v);d.className='diff '+dcls(v);$('#t'+i).innerHTML=tag(it);prog();save()}
function setV(i,k,v){cur(i).w[ui.wk][k]=v===''?null:Number(v);upd(i)}
function setFv(i,v){cur(i).fv=v;upd(i)}
function setSt(i,b){cur(i).st=b?1:0;upd(i)}
function add(){const c=prompt('Código del producto');if(!c)return;const d=prompt('Descripción');if(!d)return;
 S.secs[ui.sec].it.push({c:c.trim(),d:d.trim().toUpperCase(),fv:'',st:0,w:[0,1,2,3].map(()=>[null,null])});save();ui.f='t';ui.o='o';ctl();list();scrollTo(0,document.body.scrollHeight)}
function edit(i){const it=cur(i),c=prompt('Código',it.c);if(c===null)return;const d=prompt('Descripción',it.d);if(d===null)return;it.c=c.trim()||it.c;it.d=d.trim()||it.d;save();list()}
function del(i){if(confirm('¿Eliminar este producto?')){S.secs[ui.sec].it.splice(i,1);save();list()}}

function ven(){$('#flt').innerHTML='';const m=ui.mode==='mes',r=[];
 $('#ctl').innerHTML=`<div class="bar"><button class="${m?'pri':''}" style="flex:1" onclick="ui.mode='mes';ven()">Este mes</button><button class="${m?'':'pri'}" style="flex:1" onclick="ui.mode='7';ven()">Próximos 7 meses</button></div>`;
 S.secs.forEach(s=>s.it.forEach(it=>{const d=md(it);if(d!==null&&(m?d<=0:d>=0&&d<=7))r.push({s,it,d})}));
 r.sort((a,b)=>a.d-b.d);
 $('#main').innerHTML=r.length?r.map(({s,it,d})=>`<div class="card"><div class="top"><span>${esc(it.c)} · ${esc(nm(s))}</span><span class="tag ${d<=0?'n':'w'}">${lbl(it)}</span></div><div class="desc">${esc(it.d)}</div></div>`).join(''):'<p>No hay productos en este período.</p>'}

function exportXlsx(){if(!window.XLSX)return alert('Para exportar necesitas conexión a internet.');
 const wb=XLSX.utils.book_new();
 S.secs.forEach(s=>{
  const a=[['','',s.t,'',...[1,2,3,4].flatMap(n=>['SEMANA '+n,'',''])],['','CODIGO','DESCRIPCION','F.V',...[0,1,2,3].flatMap(()=>['SISTEMA','FISICO','TOTAL'])]];
  s.it.forEach(it=>a.push(['',it.c,it.d,lbl(it)+(it.st?'*':''),...it.w.flatMap(([x,y])=>[x??'',y??'',x===null||y===null?'':y-x])]));
  const ws=XLSX.utils.aoa_to_sheet(a);
  ws['!cols']=[{wch:2},{wch:8},{wch:44},{wch:10},...Array(12).fill({wch:8})];
  ws['!merges']=[0,1,2,3].map(k=>({s:{r:0,c:4+3*k},e:{r:0,c:6+3*k}}));
  XLSX.utils.book_append_sheet(wb,ws,s.n.slice(0,31))});
 XLSX.writeFile(wb,'INVENTARIO.xlsx')}

function res(){$('#flt').innerHTML='';
 $('#ctl').innerHTML=`<div class="bar"><select onchange="ui.wk=+this.value;res()">${opt([0,1,2,3].map(i=>[i,'Semana '+(i+1)]),ui.wk)}</select></div>`;
 let h='',T=[0,0,0,0];const det=[];
 const box=(t,n,tot,fa,so)=>`<div class="card"><div class="desc">${t}</div><div class="top"><span>Contados ${n} de ${tot}</span><span><b class="neg">${fa}</b> faltan · <b class="pos">+${so}</b> sobran</span></div></div>`;
 S.secs.forEach(s=>{let n=0,fa=0,so=0;s.it.forEach(it=>{const[a,b]=it.w[ui.wk];if(a!==null&&b!==null){n++;const d=b-a;if(d<0)fa+=d;if(d>0)so+=d;if(d)det.push({s,it,d})}});
  T[0]+=n;T[1]+=s.it.length;T[2]+=fa;T[3]+=so;h+=box(esc(nm(s)),n,s.it.length,fa,so)});
 $('#main').innerHTML=box('Total',T[0],T[1],T[2],T[3])+h+(det.length?'<h2 style="font-size:16px">Productos con diferencia</h2>'+det.map(({s,it,d})=>`<div class="card"><div class="top"><span>${esc(it.c)} · ${esc(nm(s))}</span><b class="${dcls(d)}" style="font-size:20px">${dtxt(d)}</b></div><div class="desc" style="margin:2px 0 0">${esc(it.d)}</div></div>`).join(''):'')+'<button class="pri" style="width:100%;padding:14px" onclick="exportXlsx()">Exportar Excel</button>'}
function mas(){$('#flt').innerHTML='';$('#ctl').innerHTML='';
 $('#main').innerHTML=`<div class="card"><div class="desc">Exportar</div><p class="top">Genera el Excel con tu formato, listo para imprimir.</p><button class="pri" onclick="exportXlsx()">Exportar Excel</button></div>
<div class="card"><div class="desc">Copia de seguridad</div><p class="top">Guarda tu inventario en un archivo para no perderlo si cambias de teléfono o borras los datos del navegador.</p><button class="pri" onclick="backup()">Guardar copia</button> <button onclick="$('#rf').click()">Restaurar copia</button><input id="rf" type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])"></div>
<div class="card"><div class="desc">Nueva semana</div><p class="top">Vacía sistema y físico de una semana. No borra productos ni fechas.</p><button onclick="clearWeek()">Limpiar semana</button></div>`}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo-inventario-'+now.toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.secs||!d.secs.every(s=>Array.isArray(s.it)&&s.it.every(i=>i.c!==undefined&&Array.isArray(i.w)&&i.w.length===4)))throw 0;if(!confirm('Esto reemplaza el inventario actual. ¿Continuar?'))return;S=d;ui.sec=0;save();alert('Copia restaurada');go('inv')}catch(e){alert('El archivo no es una copia válida')}};r.readAsText(f)}
function clearWeek(){const n=parseInt(prompt('¿Qué semana quieres limpiar? (1 a 4)'),10);if(!(n>=1&&n<=4))return;if(!confirm('Se borrarán sistema y físico de la semana '+n+' en todas las secciones. ¿Continuar?'))return;S.secs.forEach(s=>s.it.forEach(it=>it.w[n-1]=[null,null]));save();alert('Semana '+n+' limpiada')}
function go(v){ui.view=v;render()}
function render(){[1,2,3,4].forEach(i=>$('#n'+i).className=['inv','ven','res','mas'][i-1]==ui.view?'on':'');({inv:()=>{ctl();list()},ven,res,mas})[ui.view]()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
