function setV(i,k,v){cur(i).w[ui.wk][k]=v===''?null:Number(v);upd(i)}
function setFv(i,v){cur(i).fv=v;upd(i)}
function setSt(i,b){cur(i).st=b?1:0;upd(i)}
let tm=0;
function add(){BC='';IM='';apShow('');$('#ac').value='';$('#ad').value='';$('#as').textContent=CFG.proxy?'Escribe el código y busco la descripción en la página de la farmacia.':'Escribe el código y la descripción. Para la búsqueda automática, conéctala en Más.';$('#sh').hidden=false;setTimeout(()=>$('#ac').focus&&$('#ac').focus(),50)}
function shut(){scanClose();$('#sh').hidden=true}
function acIn(){clearTimeout(tm);const c=$('#ac').value.trim();if(c.length<3||!CFG.proxy)return;tm=setTimeout(()=>find(c),600)}
async function find(c){const s=$('#as');s.textContent='Buscando en la página…';const j=await look(c);if($('#ac').value.trim()!==c)return;
 if(j.found){$('#ad').value=String(j.name).toUpperCase();IM=j.img||'';apShow(IM);s.textContent='✓ Encontrado en la página. Puedes corregirlo.';
  if(esBarras(c)&&j.sku&&String(j.sku)!==c){BC=c;$('#ac').value=String(j.sku);s.textContent='✓ Encontrado. El código de barras se cambió por su SKU '+j.sku+'.'}}
 else s.textContent=j.err?'No pude conectar con la página. Escribe la descripción a mano.':'No encontré ese código en la página. Escribe la descripción a mano.'}
async function saveNew(){const c=$('#ac').value.trim(),d=$('#ad').value.trim(),its0=S.secs[ui.sec].it;if(!c||!d)return uiAlert('Escribe el código y la descripción.');
 if(its0.some(i=>i.c===c)&&!await uiConfirm('Ese código ya está en esta sección. ¿Agregarlo igual?'))return;
 const pi=pageFor(ui.sec),mv=pi!==ui.sec,its=S.secs[pi].it;ui.sec=pi;
 its.push({c,d:d.toUpperCase(),fv:'',st:0,...(IM?{im:IM}:{}),...(BC&&BC!==c?{bc:BC}:{}),w:[0,1,2,3].map(()=>[null,null])});save();shut();ui.f='t';ui.o='o';ctl();list();scrollTo(0,document.body.scrollHeight);if(mv)toast('La hoja anterior se llenó. Pasó a «'+nm(S.secs[pi])+'»',4200)}
async function edit(i){const it=cur(i),c=await uiPrompt('Código',it.c);if(c===null)return;const d=await uiPrompt('Descripción',it.d);if(d===null)return;it.c=c.trim()||it.c;it.d=d.trim()||it.d;save();list()}
async function del(i){if(await uiConfirm('¿Eliminar este producto?')){S.secs[ui.sec].it.splice(i,1);save();list()}}


function res(){$('#flt').innerHTML='';
 $('#ctl').innerHTML=`<div class="bar"><select onchange="ui.wk=+this.value;res()">${opt([0,1,2,3].map(i=>[i,'Semana '+(i+1)]),ui.wk)}</select></div>`;
 let h='',T=[0,0,0,0];const det=[];
 const box=(t,n,tot,fa,so)=>`<div class="card"><div class="desc">${t}</div><div class="top"><span>Contados ${n} de ${tot}</span><span><b class="neg">${fa}</b> faltan · <b class="pos">+${so}</b> sobran</span></div></div>`;
 S.secs.forEach(s=>{let n=0,fa=0,so=0;s.it.forEach(it=>{const[a,b]=it.w[ui.wk];if(a!==null&&b!==null){n++;const d=b-a;if(d<0)fa+=d;if(d>0)so+=d;if(d)det.push({s,it,d})}});
  T[0]+=n;T[1]+=s.it.length;T[2]+=fa;T[3]+=so;h+=box(esc(nm(s)),n,s.it.length,fa,so)});
 $('#main').innerHTML=box('Total',T[0],T[1],T[2],T[3])+h+(det.length?'<h2 style="font-size:16px">Productos con diferencia</h2>'+det.map(({s,it,d})=>`<div class="card"><div class="top"><span>${esc(it.c)} · ${esc(nm(s))}</span><b class="${dcls(d)}" style="font-size:20px">${dtxt(d)}</b></div><div class="desc" style="margin:2px 0 0">${esc(it.d)}</div></div>`).join(''):'')+'<button class="pri" style="width:100%;padding:14px" onclick="exportXlsx()">Exportar Excel</button><button style="width:100%;padding:14px;margin-top:8px" onclick="exportPdf()">Exportar PDF</button>'}

 +c('Exportar','Excel con tu formato exacto (horizontal, columnas y encabezado azul) o PDF listo para imprimir.','<button class="pri" onclick="exportXlsx()">Exportar Excel</button> <button class="pri" onclick="exportPdf()">Exportar PDF</button>')
 +c('Sonido al escanear','Un pitido corto y una vibración cuando el escáner lee un código.','<button class="'+(CFG.snd!==0?'pri':'')+'" onclick="setSnd(1)">Activado</button> <button class="'+(CFG.snd===0?'pri':'')+'" onclick="setSnd(0)">Desactivado</button>')
 +c('Apariencia','Elige cómo se ve la app. También puedes cambiarlo con el botón del sol o la luna arriba.','<button class="'+(thM()==='auto'?'pri':'')+'" onclick="setTh(\'auto\')">Automático</button> <button class="'+(thM()==='light'?'pri':'')+'" onclick="setTh(\'light\')">Claro</button> <button class="'+(thM()==='dark'?'pri':'')+'" onclick="setTh(\'dark\')">Oscuro</button>')
 +c('Fotos de productos','Busca en la página de la farmacia la foto de cada producto y la muestra en su tarjeta. Si la página trae primero una imagen gris, usa la siguiente. "Actualizar todas" vuelve a revisar también las que ya tenías.','<button class="pri" onclick="fotosAll()">Buscar fotos</button> <button onclick="fotosAll(1)">Actualizar todas</button>')
 +(WS?cloudCard(c):c('Espacio de la farmacia (nube)','Conecta a todo el equipo: cada persona con su usuario y la administración ve todos los inventarios. Se actualiza solo en todos los dispositivos.',(CU.adm?'<button class="pri" onclick="crearWs()">Crear espacio</button> ':'')+'<button onclick="joinWs()">Tengo un código</button>')+c('Respaldo en la nube',SY?'<span>Activo. Tu inventario se guarda y se actualiza solo entre tus dispositivos.<br>'+(SY.msg?esc(SY.msg):'')+'<br>Tu código: <b style="letter-spacing:1px">'+esc(SY.code)+'</b></span>':'Guarda tu inventario en internet (cifrado) para verlo igual en el teléfono y en la computadora.','<button class="pri" onclick="'+(SY?'syRun(1)">Sincronizar ahora</button> <button onclick="syOff()">Desactivar</button>':'syOn()">Activar respaldo</button> <button onclick="syJoin()">Ya tengo un código</button>')))
 +c('Copia de seguridad','Guarda tu inventario en un archivo para no perderlo si borras los datos del navegador.','<button class="pri" onclick="backup()">Guardar copia</button> <button onclick="$(\'#rf\').click()">Restaurar copia</button><input id="rf" type="file" accept=".json,application/json" hidden onchange="restore(this.files[0])">')
 +c('Secciones','Agrega una sección nueva, cambia el nombre de la que estás viendo o elimínala.','<button onclick="newSec()">Nueva sección</button> '+(S.secs.length?'<button onclick="renameSec()">Renombrar sección actual</button> <button onclick="delSec()">Eliminar sección actual</button>':''))
 +c('Nueva semana','Vacía sistema y físico de una semana. No borra productos ni fechas.','<button onclick="clearWeek()">Limpiar semana</button>')
 +(WS?c('Reportar un problema','¿Algo no funciona o se ve mal? Cuéntalo y le llega a la administración.','<button class="pri" onclick="reportar()">Reportar problema</button>'):'')
 +c('Usuario: '+esc(CU.n),'Cierra tu sesión para que otra persona use su inventario.','<button class="pri" onclick="logout()">Cambiar de usuario</button> <button onclick="go(\'per\')">Mi perfil</button>'+(WS?' <button onclick="cambiarPin()">Cambiar mi PIN</button>':'')+(CU.adm&&!WS?' <button onclick="adminPin()">Restablecer PIN de un usuario</button>':''))}
function backup(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo-inventario-'+now.toISOString().slice(0,10)+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.secs||!d.secs.every(s=>Array.isArray(s.it)&&s.it.every(i=>i.c!==undefined&&Array.isArray(i.w)&&i.w.length===4)))throw 0;if(!await uiConfirm('Esto reemplaza el inventario actual. ¿Continuar?'))return;S=d;paginar();ui.sec=0;save();uiAlert('Copia restaurada');go('inv')}catch(e){uiAlert('El archivo no es una copia válida')}};r.readAsText(f)}

const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const nn=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(),cap=s=>String(s).trim().replace(/\s+/g,' ').replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()),DUPMSG='Ya existe un usuario con ese nombre. Agrega tu apellido o una inicial (ej. José P.).';
const PX='https://saas-buscador.esthebanenrique1.workers.dev';
let WS=ld('inv_ws',null),RO=0,RB=null,RN='',WELCOME=0;
U=WS?ld('inv_cu',[]):ld('inv_users_v2',[]);
const lsw=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const sv0=()=>lsw('inv_cu',U.map(u=>({...u,pf:{...(u.pf||{}),f:undefined}})));
const sv=()=>{if(!WS)return localStorage.setItem('inv_users_v2',JSON.stringify(U));
 if(CU){const x=U.find(u=>u.id===CU.id);if(x)x.n=CU.n;lsw('inv_ph_'+CU.id,{phl:((CU.pf||{}).f||'').length,f:(CU.pf||{}).f||''});cpf()}sv0()};
const hs=async(i,s)=>{s=i+'|'+String(s).trim().toLowerCase();try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('saas|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p'+s}};
const A=h=>{WELCOME=0;const a=$('#auth');a.innerHTML=h;a.hidden=false;$('#app').hidden=true;if(a.classList){a.classList.remove('fi');void a.offsetWidth;a.classList.add('fi')}};
const gr=()=>{const h=new Date().getHours();return h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'};
const lg=`<img src="${LOGO}" alt="Farmacia SAAS">`;
const pw=(id,ph)=>`<input id="${id}" type="password" inputmode="numeric" maxlength="6" placeholder="${ph}">`;
function welcome(){if(WS)return welcomeC();A(lg+`<h2>${gr()}</h2><p>${U.length?'Elige tu usuario para continuar':'Bienvenido(a). Crea tu usuario para empezar'}</p>`+U.map(u=>`<button class="ub" onclick="pin('${u.id}')"><span class="av">${u.pf&&u.pf.f?`<img src="${u.pf.f}" alt="">`:esc(u.n[0].toUpperCase())}</span>${esc(u.n)}</button>`).join('')+'<button class="pri" onclick="signup()">Crear usuario</button><button onclick="joinWs()">Tengo un código de la farmacia</button>')}
function signup(){if(WS)return signupC();A(lg+`<h2>Nuevo usuario</h2><p>${U.length?'Empezarás con un inventario vacío que puedes importar desde Excel.':'Tu inventario actual se guardará en este usuario.'}</p><input id="un" placeholder="Tu nombre">${pw('p1','PIN (4 a 6 números)')}<input id="qq" placeholder="Pregunta secreta (ej. ¿Nombre de tu mascota?)"><input id="aa" placeholder="Respuesta"><button class="pri" onclick="mk()">Crear usuario</button><button onclick="welcome()">Volver</button>`)}
async function mk(){const n=$('#un').value.trim(),p=$('#p1').value.trim(),q=$('#qq').value.trim(),a=$('#aa').value;
 if(!n||!q||!a.trim())return uiAlert('Completa nombre, pregunta y respuesta.');
 if(!/^\d{4,6}$/.test(p))return uiAlert('El PIN debe tener de 4 a 6 números.');
 if(U.some(u=>nn(u.n)===nn(n)))return uiAlert(DUPMSG);
 const id='u'+Date.now(),first=!U.length;
 U.push({id,n,p:await hs(id,p),q,a:await hs(id,a),adm:first?1:0});sv();
 localStorage.setItem('inv_data_'+id,JSON.stringify(first?(ld(KEY,null)||DATA):{secs:[]}));enter(id)}
function pin(id){const u=U.find(x=>x.id==id);A(lg+`<h2>${esc(u.n)}</h2><p>Escribe tu PIN</p>${pw('p1','PIN')}<button class="pri" onclick="login('${id}')">Entrar</button><button onclick="${WS?`uiAlert('Pide al administrador que te restablezca el PIN.')`:`forgot('${id}')`}">Olvidé mi PIN</button><button onclick="welcome()">Volver</button>`)}
async function login(id){if(WS)return loginC(id);const u=U.find(x=>x.id==id);if(await hs(id,$('#p1').value)===u.p)enter(id);else uiAlert('PIN incorrecto')}

const LIM=()=>{const n=parseInt(CFG&&CFG.lim,10);return n>=10&&n<=60?n:32};

function nextName(b){let k=2,n;do{n=(b+'_'+k++).slice(0,31)}while(S.secs.some(s=>s.n===n));return n}
function paginar(){let c=0;for(let i=0;i<S.secs.length;i++){const s=S.secs[i];if(s.it.length>LIM()){S.secs.splice(i+1,0,{n:nextName(sbase(s.n)),t:s.t,it:s.it.splice(LIM())});c++}}return c}
function pageFor(si){const b=sbase(S.secs[si].n),t=S.secs[si].t,fam=j=>j<S.secs.length&&sbase(S.secs[j].n)===b&&S.secs[j].t===t;let i=si;
 while(fam(i)&&S.secs[i].it.length>=LIM())i++;if(fam(i))return i;
 S.secs.splice(i,0,{n:nextName(b),t,it:[]});return i}

 s.textContent='Código de barras '+code+' leído. Escribe el SKU y la descripción: la próxima vez se llenará solo.'}
function loadZx(){return new Promise((ok,no)=>{if(window.ZXing)return ok();const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
function scanClose(){if(scn){try{scn.stop()}catch(e){}scn=null}const o=$('#scn');if(o)o.hidden=true}
let scanMode='sheet',AC=null;
function sndUnlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(ok){if(CFG.snd===0)return;try{if(navigator.vibrate)navigator.vibrate(ok?45:[60,40,60]);sndUnlock();if(!AC)return;const t0=AC.currentTime;(ok?[[1320,0],[1760,.09]]:[[330,0],[262,.12]]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.28,t0+d+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d+.13);o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+.15)})}catch(e){}}
function setSnd(v){CFG.snd=v;try{localStorage.setItem('inv_cfg',JSON.stringify(CFG))}catch(e){}if(v){beep(1)}render()}
async function scanOpen(m){scanMode=m||'sheet';sndUnlock();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return uiAlert('Este navegador no permite usar la cámara. Escribe el código a mano.');
 $('#scn').hidden=false;$('#scm').textContent=scanMode==='find'?'Escanea el producto para buscarlo en tu inventario':'Apunta al código de barras';
 try{
  if('BarcodeDetector' in window){
   const det=new BarcodeDetector({formats:BF}),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}),v=$('#scv');
   v.srcObject=st;await v.play();let tm2=0,busy=0;
   scn={stop:()=>{clearInterval(tm2);st.getTracks().forEach(x=>x.stop());v.srcObject=null}};
   tm2=setInterval(async()=>{if(busy)return;busy=1;try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;scanClose();scanDone(c)}}catch(e){}busy=0},300)
  }else{
   await loadZx();const rd=new ZXing.BrowserMultiFormatReader();scn={stop:()=>rd.reset()};
   rd.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},'scv',r=>{if(r){const c=r.getText();scanClose();scanDone(c)}})
  }
 }catch(e){scanClose();uiAlert(e&&e.name==='NotAllowedError'?'Necesito permiso para usar la cámara. Actívalo en los ajustes del navegador.':'No pude abrir el escáner. Revisa la cámara y la conexión a internet, o escribe el código a mano.')}}

let tt=0;function toast(m,ms){const e=$('#toast');if(!e)return;clearTimeout(tt);if(!m){e.classList.remove('on');return}e.textContent=m;e.classList.add('on');if(ms!==0)tt=setTimeout(()=>e.classList.remove('on'),ms||2600)}
function flash(i){const e=$('#k'+i);if(e){e.scrollIntoView({block:'center'});e.classList.add('fl');setTimeout(()=>e.classList.remove('fl'),2500)}}
function goItem(L,msg){ui.sec=S.secs.indexOf(L.s);ui.f='t';ui.o='o';ctl();list();flash(L.s.it.indexOf(L.it));toast(msg)}
const scanDone=c=>(beep(1),0)||scanMode==='auto'?autoScan(c):scanMode==='find'?findScan(c):onScan(c);

async function findScan(code){code=String(code).trim();let L=findLocal(code);
 if(!L&&CFG.proxy){toast('Código leído. Buscando…',0);const j=await look(code);if(j.found&&j.sku){L=findLocal(String(j.sku));if(L&&String(j.sku)!==code){L.it.bc=L.it.bc||code;save()}}}
 if(L)return goItem(L,nm(L.s)+' · '+L.it.d.slice(0,34));
 toast('');uiAlert('Este producto no está en tu inventario.')}
async function autoScan(code){code=String(code).trim();
 const L=findLocal(code);if(L)return goItem(L,'Ya lo tienes en '+nm(L.s));
 toast('Código leído. Buscando producto…',0);
 const j=CFG.proxy?await look(code):{err:1};
 if(j.found&&j.sku){const sku=String(j.sku),L2=findLocal(sku);
  if(L2){if(sku!==code)L2.it.bc=code;save();return goItem(L2,'Ya lo tienes en '+nm(L2.s))}
  const pi=pageFor(ui.sec),mv=pi!==ui.sec,its=S.secs[pi].it;ui.sec=pi;its.push({c:sku,d:String(j.name).toUpperCase(),fv:'',st:0,...(j.img?{im:j.img}:{}),...(sku!==code?{bc:code}:{}),w:[0,1,2,3].map(()=>[null,null])});
  save();ui.f='t';ui.o='o';ctl();list();flash(its.length-1);return toast(mv?'Hoja llena. Agregado en «'+nm(S.secs[pi])+'»: '+String(j.name).toUpperCase().slice(0,30):'✓ Agregado: '+String(j.name).toUpperCase().slice(0,40),mv?4200:2600)}
 toast('');add();BC=code;
 if(j.found){$('#ad').value=String(j.name).toUpperCase();IM=j.img||'';apShow(IM);$('#as').textContent='Encontré la descripción. Escribe el código (SKU) del producto.'}
 else $('#as').textContent=j.err?'No pude conectar con la página. Escribe el SKU y la descripción: la próxima vez se llenará solo.':'Código de barras '+code+' leído, pero no lo encontré en la página. Escribe el SKU y la descripción: la próxima vez se llenará solo.'}
/* ===== Alertas ===== */
function alertasHtml(){let mes=0,vv=0,pe=0;
 S.secs.forEach(s=>s.it.forEach(it=>{const d=md(it);if(d===null)return;if(d<0)vv++;else if(d===0)mes++;if(POL){const g=labOf(it);if(g&&g.m!=null&&d>=0&&d<=g.m)pe++}}));
 const r=(n,x,g,c)=>n?`<button class="al ${c}" onclick="${g}"><b>${n}</b> ${x}<span>›</span></button>`:'';
 const h=r(mes,mes==1?'producto vence este mes':'productos vencen este mes',"ui.mode='mes';go('ven')",'w')+r(vv,vv==1?'producto ya vencido':'productos ya vencidos',"ui.mode='mes';go('ven')",'n')+(POL?r(pe,pe==1?'producto toca sacar por política':'productos tocan sacar por política',"ui.pm='ya';go('pol')",'w'):'<button class="al" onclick="go(\'pol\')">Carga la política de devolución para ver cuáles sacar<span>›</span></button>');
 return h?`<div class="card" style="padding:12px 12px 6px"><div class="desc" style="font-size:15px;margin:0 0 8px">Alertas</div>${h}</div>`:''}

function start(){thApply();tick();welcome();const f=new URLSearchParams(location.search).get('f');if(f&&(!WS||WS.code!==f.trim().toUpperCase()))joinWs(f)}
function fade(){const m=$('#main');if(m.classList){m.classList.remove('fi');void m.offsetWidth;m.classList.add('fi')}}
function go(v){ui.view=v;render();fade()}
function render(){document.body.classList.toggle('chatc',ui.view==='chat'&&!!ui.cc);if(!(ui.view==='chat'&&ui.cc)){['#cinb','#cvt','#cmn','#civ'].forEach(s=>{const o=$(s);if(o)o.remove()})}Object.entries({n1:'inv',n2:'ven',n5:'pol',n3:'res',n4:'mas'}).forEach(([id,v])=>$('#'+id).className=(v==ui.view||(v=='mas'&&ui.view=='adm'))?'on':'');({inv:()=>{if(!S.secs.length)return empty();ui.sec=Math.min(ui.sec,S.secs.length-1);ctl();list()},ven,pol,res,mas,per,adm,chat})[ui.view]()}
start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
